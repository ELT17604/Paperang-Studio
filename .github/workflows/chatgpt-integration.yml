name: ChatGPT integration checks

on:
  push:
    paths:
      - "Integrations/ChatGPT/**"
      - ".github/workflows/chatgpt-integration.yml"
  pull_request:
    paths:
      - "Integrations/ChatGPT/**"
      - ".github/workflows/chatgpt-integration.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r Integrations/ChatGPT/requirements.txt
      - name: Compile adapter
        run: python -m compileall -q Integrations/ChatGPT
      - name: Import adapter without starting server
        working-directory: Integrations/ChatGPT
        run: python -c "import core, server"
      - name: Verify baseline registry
        run: python scripts/check-versions.py
