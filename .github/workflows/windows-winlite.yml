name: Windows WinLite transport gates
on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: winlite-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PAPERANG_WIN_WORK_DIR: ${{ github.workspace }}/work/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r Server/requirements.txt
      - run: python scripts/check-versions.py
      - run: python tests/test_contract_inventory.py
      - run: python -m unittest discover -s tests/windows -p test_usb_probe.py -v
      - run: dotnet run --project tests/windows/Paperang.Tests -c Release
      - run: python tests/windows/run_integration.py
      - run: ./Windows/scripts/build.ps1
      - run: ./Windows/scripts/build-installer.ps1 -Iscc 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: winlite-candidate
          path: |
            work/windows/Release/*.exe
            work/windows/Release/*.zip
            work/windows/Release/*.sha256
